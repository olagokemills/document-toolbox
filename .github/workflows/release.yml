name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:desktop

      - name: Package for macOS
        run: pnpm --filter @private-pdf/desktop exec electron-builder --mac --publish never

      - uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/dist/*.dmg

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:desktop

      - name: Package for Windows
        run: pnpm --filter @private-pdf/desktop exec electron-builder --win --publish never

      - uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/dist/*.exe
